# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: (prompts/.*\.txt|docs/research/(software-stack/)?patches/.*\.patch)
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
    # raw benchmark evidence must keep its bytes (FILES.tsv hashes); the authored guides stay checked
    exclude: ^docs/benchmarks/(?!(README|CAMPAIGNS|MATRIX-GUIDE|AGENTS)\.md$)
  - id: end-of-file-fixer
    # raw benchmark evidence must keep its bytes (FILES.tsv hashes); the authored guides stay checked
    exclude: ^docs/benchmarks/(?!(README|CAMPAIGNS|MATRIX-GUIDE|AGENTS)\.md$)
  - id: check-yaml
  - id: check-added-large-files
- repo: https://github.com/PyCQA/flake8
  rev: 7.0.0
  hooks:
  -   id: flake8
      additional_dependencies: [flake8-no-print]
